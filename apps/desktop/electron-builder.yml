appId: com.huabu.app
productName: Huabu
copyright: Copyright © 2025 ${author}

# Where electron-builder places the packaged output.
#
# IMPORTANT — Windows file-lock workaround:
# We deliberately output to a sibling of the workspace (../../../huabu-electron-out/
# i.e. D:/code/huabu-electron-out/) instead of `dist-electron/` inside the repo.
# On Windows, the VS Code main process opens `app.asar` files it discovers in the
# workspace with FILE_SHARE_NONE, which prevents electron-builder from overwriting
# the file on subsequent builds (ERR_ELECTRON_BUILDER_CANNOT_EXECUTE "The process
# cannot access the file because it is being used by another process"). Placing the
# output outside the workspace removes the file from VS Code's awareness entirely.
directories:
  output: ../../../huabu-electron-out
  buildResources: build-resources

# Source files for the main process (compiled JS)
files:
  - dist/**

# Extra files bundled into the app's Resources directory:
#   resources/server/server.js  — self-contained Fastify bundle (tsup full-bundle, ~13MB)
#   resources/server/prompt/    — AGENT.md / SKILL.md / .md fragments read at
#                                 runtime by the prompt loaders. The loaders
#                                 resolve them as `path.join(HERE, 'prompt')`
#                                 where `HERE` = the dir containing server.js
#                                 (see apps/server/src/prompt/agents/loader.ts
#                                 and skills/loader.ts). Without this entry,
#                                 every LLM call 500s because no prompt can
#                                 be assembled.
#   resources/server/agentlet/  — agentlet daemon (index.js + sibling .js
#                                 modules from external/agentlet/.../dist).
#                                 Forked by `DaemonSupervisor` at server
#                                 startup; the supervisor resolves it as
#                                 `<bundleDir>/agentlet/index.js` (see
#                                 apps/server/src/modules/agent/acp/daemon-supervisor.ts).
#                                 Without this entry, external-agent
#                                 dispatch returns "agentlet daemon entry
#                                 not found" and Settings shows the
#                                 daemon as permanently offline.
#   resources/web/              — compiled Vite SPA
#
# No node_modules needed: all npm deps (except @napi-rs native addons) are
# inlined into server.js by tsup. @napi-rs/canvas is never called at runtime
# since pdf2md only uses unpdf's text extraction path.
extraResources:
  - from: ../server/dist-bundle/server.js
    to: server/server.js
  # sql.js (bundled into server.js via @agentlet/server -> DataStore)
  # loads its wasm via `path.join(__dirname, 'sql-wasm.wasm')`, where
  # __dirname (polyfilled in the tsup banner) = the directory of
  # server.js. Ship the wasm next to server.js so the lookup succeeds.
  # Missing this file = ENOENT during boot = the server process exits
  # with code 1 and Electron shows the "failed to start" dialog.
  - from: ../server/dist-bundle/sql-wasm.wasm
    to: server/sql-wasm.wasm
  - from: ../server/dist-bundle/prompt
    to: server/prompt
    filter:
      # Only `.md` is read at runtime (AGENT.md / SKILL.md / fragments).
      # The recursive `cpSync` in apps/server/tsup.config.ts unavoidably
      # picks up sibling `.ts` source files too; exclude them so we don't
      # bloat the installer with dead source.
      - '**/*.md'
  - from: ../server/dist-bundle/agentlet
    to: server/agentlet
    filter:
      # Only the compiled .js + sourcemaps are needed at runtime; .d.ts
      # files bloat the installer for no benefit. sql-wasm.wasm is
      # required by sql.js when the forked daemon initialises its own
      # DataStore — same __dirname-relative lookup as the main server.
      - '**/*.js'
      - '**/*.js.map'
      - '**/*.wasm'
  - from: ../web/dist
    to: web
    filter:
      - '**/*'
  # Runtime icons used by BrowserWindow / app.dock at app launch.
  # (The platform installer icons themselves are still picked up from
  # build-resources/icon.{ico,icns,png} automatically by electron-builder.)
  - from: build-resources/icon.png
    to: icons/icon.png
  - from: build-resources/icon.ico
    to: icons/icon.ico

afterPack: scripts/after-pack.mjs

mac:
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.productivity
  darkModeSupport: true

win:
  target:
    - target: nsis
      arch:
        - x64

linux:
  target:
    - target: AppImage
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

dmg:
  window:
    width: 540
    height: 380
