appId: com.sediment.app
productName: Sediment
copyright: Copyright © 2025 ${author}

# Where electron-builder places the packaged output
directories:
  output: dist-electron
  buildResources: build-resources

# Source files for the main process (compiled JS)
files:
  - dist/**

# Extra files bundled into the app's Resources directory:
#   resources/server/server.js  — self-contained Fastify bundle (tsup full-bundle, ~13MB)
#   resources/web/              — compiled Vite SPA
#
# No node_modules needed: all npm deps (except @napi-rs native addons) are
# inlined into server.js by tsup. @napi-rs/canvas is never called at runtime
# since pdf2md only uses unpdf's text extraction path.
#
# Not bundled (yet): the `bin/agentlet` shell wrapper. It only works inside
# the monorepo checkout (auto-runs pnpm, reads .env from repo root) and has
# no Windows-compatible launcher, so shipping it would advertise a feature
# that doesn't run in packaged builds. The Settings UI degrades gracefully
# because the server reports `agentletWrapperPath: null` when the env var
# is absent.
extraResources:
  - from: ../server/dist-bundle/server.js
    to: server/server.js
  - from: ../web/dist
    to: web
    filter:
      - '**/*'
  # Runtime icons used by BrowserWindow / app.dock at app launch.
  # (The platform installer icons themselves are still picked up from
  # build-resources/icon.{ico,icns,png} automatically by electron-builder.)
  - from: build-resources/icon.png
    to: icons/icon.png
  - from: build-resources/icon.ico
    to: icons/icon.ico

afterPack: scripts/after-pack.mjs

mac:
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.productivity
  darkModeSupport: true

win:
  target:
    - target: nsis
      arch:
        - x64

linux:
  target:
    - target: AppImage
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

dmg:
  window:
    width: 540
    height: 380
