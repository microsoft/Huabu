name: CI

# Enforced quality gate. Runs on every pull request and push targeting
# `dev` or `main`. Mark the `quality` job as a required status check in
# the branch-protection settings so it cannot be bypassed locally.
#
# Local git hooks (.githooks/) are optional and only provide faster
# feedback; this workflow is the authoritative gate.

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint / Format / Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version is inferred from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # typecheck pulls in workspace packages whose dist/ outputs don't
      # exist on a fresh checkout. Build both external trees first
      # (same rationale as release.yml).
      - name: Build workspace protocol/runtime packages
        run: pnpm run build:agentlet && pnpm run build:agenetes

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm exec prettier --check .

      - name: Typecheck
        run: pnpm run typecheck

      - name: i18n parity
        run: pnpm run check:i18n
