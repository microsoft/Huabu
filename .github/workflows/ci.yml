name: CI

# CircleCI (.circleci/config.yml) is now the authoritative quality gate;
# it runs the identical lint / format / typecheck / i18n / skills checks
# on `main`. This workflow is kept as a manually-triggerable fallback so
# the checks can still be run on GitHub-hosted runners if CircleCI is
# unavailable — it no longer runs automatically, because the Actions
# minute quota is exhausted.
#
# To re-enable automatic runs, restore:
#   pull_request:
#     branches: [main]
#   push:
#     branches: [main]
# and re-add `quality` as a required status check in branch protection.
#
# Local git hooks (.githooks/) are optional and only provide faster
# feedback.

on:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint / Format / Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Version is inferred from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # typecheck pulls in workspace packages whose dist/ outputs don't
      # exist on a fresh checkout. Build both external trees first
      # (same rationale as release.yml).
      - name: Build workspace protocol/runtime packages
        run: pnpm run build:agentlet && pnpm run build:agenetes

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm exec prettier --check .

      - name: Typecheck
        run: pnpm run typecheck

      # `--no-bail` so one red package does not hide the rest; the exit code
      # is still non-zero, so the gate holds.
      - name: Unit tests
        run: pnpm -r --if-present --no-bail run test

      - name: i18n parity
        run: pnpm run check:i18n

      - name: Agent Team skills
        run: pnpm run test:agent-team-skills && pnpm run check:agent-team-skills
