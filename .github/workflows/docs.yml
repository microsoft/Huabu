name: Documentation

on:
  pull_request:
    branches: [dev, main]
    paths:
      - apps/docs/**
      - .github/workflows/docs.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
  push:
    branches: [main]
    paths:
      - apps/docs/**
      - .github/workflows/docs.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build handbook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve Pages configuration
        id: pages-config
        shell: bash
        env:
          CONFIGURED_BASE: ${{ vars.DOCS_BASE_PATH }}
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          base_path="${CONFIGURED_BASE:-/$repository_name/}"
          echo "base_path=$base_path" >> "$GITHUB_OUTPUT"
          echo "canonical_origin=https://${GITHUB_REPOSITORY_OWNER}.github.io" >> "$GITHUB_OUTPUT"
      - name: Test handbook
        run: pnpm run test:docs
      - name: Build handbook
        run: pnpm run build:docs
        env:
          DOCS_BASE_PATH: ${{ steps.pages-config.outputs.base_path }}
          DOCS_CANONICAL_ORIGIN: ${{ steps.pages-config.outputs.canonical_origin }}
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  deploy:
    name: Deploy handbook
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
