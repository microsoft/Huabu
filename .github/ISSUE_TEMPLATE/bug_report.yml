name: Bug report
description: Report a reproducible problem or unexpected behavior in Huabu
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Huabu. Please search existing issues before submitting a new report.

        Do not include API keys, access tokens, private documents, personal information, or other sensitive data.

  - type: textarea
    id: bug-details
    attributes:
      label: Bug details
      description: Describe what happened, how to reproduce it, and your system information. Include what you expected and any error message if relevant.
      placeholder: |
        What happened?
        How can we reproduce it?
        What did you expect?
        System information (Help → Troubleshooting → Copy System Information):
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context (optional)
      description: Add screenshots, recordings, relevant logs, or AI details such as the mode, agent, provider, and model. Remove sensitive information first.

  - type: checkboxes
    id: sensitive-information
    attributes:
      label: Sensitive information
      options:
        - label: I reviewed this report and its attachments and removed sensitive information.
          required: true
