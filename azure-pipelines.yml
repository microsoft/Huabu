trigger:
  branches:
    exclude:
      - '*'
  tags:
    include:
      - 'v*.*.*'

pr: none

parameters:
  - name: releaseTag
    displayName: 'Release tag for manual branch runs (e.g. v0.1.0-rc.1)'
    type: string
    default: ''
  - name: buildMacOS
    displayName: Build macOS alongside Windows
    type: boolean
    default: true

jobs:
  - job: Windows
    displayName: Build Windows desktop
    timeoutInMinutes: '120'
    pool:
      vmImage: windows-latest
    steps:
      - checkout: self

      - pwsh: |
          $nodeVersion = (Get-Content -LiteralPath (Join-Path $env:BUILD_SOURCESDIRECTORY '.nvmrc') -Raw -ErrorAction Stop).Trim()
          if ([string]::IsNullOrWhiteSpace($nodeVersion)) { throw '.nvmrc must specify a Node.js version' }
          Write-Host "##vso[task.setvariable variable=nodeVersion]$nodeVersion"
        displayName: Read Node.js version from .nvmrc

      - task: UseNode@1
        displayName: Set up Node.js from .nvmrc
        inputs:
          version: '$(nodeVersion)'

      - pwsh: |
          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --version
        displayName: Enable pnpm from packageManager

      - pwsh: |
          @'
          const fs = require('node:fs');
          const path = 'apps/desktop/package.json';
          const ref = process.env.BUILD_SOURCEBRANCH ?? '';
          const tag = ref.startsWith('refs/tags/') ? ref.slice('refs/tags/'.length) : (process.env.RELEASE_TAG ?? '');
          const version = tag.startsWith('v') ? tag.slice(1) : '';
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;
          if (!semver.test(version)) {
            console.error(`Release tag must be valid semver prefixed with v: ${tag}`);
            process.exit(1);
          }
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.version = version;
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          console.log(`Desktop version: ${version}`);
          console.log(`##vso[task.setvariable variable=WindowsInstallerName]Huabu-Setup-${version}.exe`);
          '@ | node
        displayName: Set app version from release tag
        env:
          RELEASE_TAG: ${{ parameters.releaseTag }}

      - pwsh: pnpm install --frozen-lockfile
        displayName: Install dependencies

      - pwsh: node --test .\apps\desktop\scripts\esrp-release.test.mjs
        displayName: Test signed installer metadata refresh

      - pwsh: pnpm run build:agentlet
        displayName: Build agentlet workspace packages

      - pwsh: |
          foreach ($name in @('CodeSignAuthSignCertificateName', 'CodeSignAppRegistrationTenantId', 'CodeSignAppRegistrationClientId', 'CodeSignEsrpClientId', 'CodeSignConnectedServiceName', 'CodeSignKeyVaultName')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value) -or $value.StartsWith('$(')) {
              throw "Configure the Azure Pipelines variable: $name"
            }
          }
        displayName: Validate ESRP signing configuration
        env:
          CodeSignAuthSignCertificateName: $(CodeSignAuthSignCertificateName)
          CodeSignAppRegistrationTenantId: $(CodeSignAppRegistrationTenantId)
          CodeSignAppRegistrationClientId: $(CodeSignAppRegistrationClientId)
          CodeSignEsrpClientId: $(CodeSignEsrpClientId)
          CodeSignConnectedServiceName: $(CodeSignConnectedServiceName)
          CodeSignKeyVaultName: $(CodeSignKeyVaultName)

      - pwsh: |
          pnpm run build:desktop:win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = Join-Path (Join-Path $env:BUILD_SOURCESDIRECTORY '..\huabu-electron-out') $env:WINDOWS_INSTALLER_NAME
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256 -ErrorAction Stop).Hash
          Write-Host "##vso[task.setvariable variable=WindowsUnsignedInstallerHash]$hash"
        displayName: Build desktop installer
        env:
          WINDOWS_INSTALLER_NAME: $(WindowsInstallerName)

      - task: UseDotNet@2
        displayName: Install .NET 8 for ESRP
        inputs:
          version: 8.x

      # Installer-only signing: embedded application binaries and the uninstaller are out of scope.
      - task: EsrpCodeSigning@6
        displayName: ESRP sign and verify Windows installer using WIF
        timeoutInMinutes: 25
        inputs:
          ConnectedServiceName: $(CodeSignConnectedServiceName)
          AppRegistrationClientId: $(CodeSignAppRegistrationClientId)
          AppRegistrationTenantId: $(CodeSignAppRegistrationTenantId)
          AuthAKVName: $(CodeSignKeyVaultName)
          useMsiAuthentication: true
          esrpClientId: $(CodeSignEsrpClientId)
          AuthSignCertName: $(CodeSignAuthSignCertificateName)
          FolderPath: '$(Build.SourcesDirectory)/../huabu-electron-out'
          Pattern: $(WindowsInstallerName)
          UseMinimatch: true
          SessionTimeout: 20
          ServiceEndpointUrl: 'https://api.esrp.microsoft.com/api/v2'
          signConfigType: inlineSignParams
          inlineOperation: |
            [
              {
                "keyCode": "CP-230012",
                "operationCode": "SigntoolSign",
                "parameters": {
                  "OpusName": "Microsoft",
                  "OpusInfo": "http://www.microsoft.com",
                  "FileDigest": "/fd \"SHA256\"",
                  "PageHash": "/NPH",
                  "TimeStamp": "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256"
                },
                "toolName": "sign",
                "toolVersion": "1.0"
              },
              {
                "keyCode": "CP-230012",
                "operationCode": "SigntoolVerify",
                "parameters": {},
                "toolName": "sign",
                "toolVersion": "1.0"
              }
            ]

      - pwsh: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:BUILD_SOURCESDIRECTORY '..\huabu-electron-out'
          $installer = Join-Path $output $env:WINDOWS_INSTALLER_NAME
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate -or -not $signature.TimeStamperCertificate) {
            throw "Missing valid timestamped Authenticode signature: $installer ($($signature.Status))"
          }
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -eq $env:UNSIGNED_INSTALLER_HASH) {
            throw 'ESRP did not modify the installer'
          }
          node .\apps\desktop\scripts\esrp-release.mjs $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        displayName: Verify installer signature and refresh update metadata
        env:
          WINDOWS_INSTALLER_NAME: $(WindowsInstallerName)
          UNSIGNED_INSTALLER_HASH: $(WindowsUnsignedInstallerHash)

      - pwsh: |
          $output = Join-Path $env:BUILD_SOURCESDIRECTORY '../huabu-electron-out'
          foreach ($pattern in @('*.exe', '*.exe.blockmap', 'latest.yml')) {
            $files = @(Get-ChildItem -Path $output -Filter $pattern -File -ErrorAction Stop)
            if ($files.Count -eq 0) { throw "Missing required release asset: $pattern" }
            $files | Select-Object Name, Length
          }
        displayName: Validate Windows release assets

      - task: PublishPipelineArtifact@1
        displayName: Publish complete Windows release output
        inputs:
          targetPath: '$(Build.SourcesDirectory)/../huabu-electron-out'
          artifact: huabu-windows
          publishLocation: pipeline

  - job: macOS
    displayName: Build macOS desktop
    condition: and(succeeded(), ${{ parameters.buildMacOS }})
    timeoutInMinutes: '180'
    variables:
      MacEsrpRoot: '$(Agent.TempDirectory)/huabu-macos-esrp'
    pool:
      vmImage: macos-latest
    steps:
      - checkout: self

      - pwsh: |
          $nodeVersion = (Get-Content -LiteralPath (Join-Path $env:BUILD_SOURCESDIRECTORY '.nvmrc') -Raw -ErrorAction Stop).Trim()
          if ([string]::IsNullOrWhiteSpace($nodeVersion)) { throw '.nvmrc must specify a Node.js version' }
          Write-Host "##vso[task.setvariable variable=nodeVersion]$nodeVersion"
        displayName: Read Node.js version from .nvmrc

      - task: UseNode@1
        displayName: Set up Node.js from .nvmrc
        inputs:
          version: '$(nodeVersion)'

      - pwsh: |
          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --version
        displayName: Enable pnpm from packageManager

      - pwsh: |
          @'
          const fs = require('node:fs');
          const path = 'apps/desktop/package.json';
          const ref = process.env.BUILD_SOURCEBRANCH ?? '';
          const tag = ref.startsWith('refs/tags/') ? ref.slice('refs/tags/'.length) : (process.env.RELEASE_TAG ?? '');
          const version = tag.startsWith('v') ? tag.slice(1) : '';
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;
          if (!semver.test(version)) {
            console.error(`Release tag must be valid semver prefixed with v: ${tag}`);
            process.exit(1);
          }
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.version = version;
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          console.log(`Desktop version: ${version}`);
          '@ | node
        displayName: Set app version from release tag
        env:
          RELEASE_TAG: ${{ parameters.releaseTag }}

      - pwsh: pnpm install --frozen-lockfile
        displayName: Install dependencies

      - pwsh: pnpm run build:agentlet
        displayName: Build agentlet workspace packages

      - pwsh: node --test apps/desktop/scripts/esrp-macos.test.mjs
        displayName: Test Apple release preparation and validation

      - pwsh: |
          foreach ($name in @('CodeSignAuthSignCertificateName', 'CodeSignAppRegistrationTenantId', 'CodeSignAppRegistrationClientId', 'CodeSignConnectedServiceName', 'CodeSignKeyVaultName')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value) -or $value.StartsWith('$(')) {
              throw "Configure the Azure Pipelines variable: $name"
            }
          }
        displayName: Validate Apple ESRP signing configuration
        env:
          CodeSignAuthSignCertificateName: $(CodeSignAuthSignCertificateName)
          CodeSignAppRegistrationTenantId: $(CodeSignAppRegistrationTenantId)
          CodeSignAppRegistrationClientId: $(CodeSignAppRegistrationClientId)
          CodeSignConnectedServiceName: $(CodeSignConnectedServiceName)
          CodeSignKeyVaultName: $(CodeSignKeyVaultName)

      - bash: |
          set -euo pipefail
          pnpm run build:desktop:mac --dir --arm64 --x64 --config electron-builder.esrp.yml --config.directories.output="$MAC_ESRP_ROOT/prepared"
          node apps/desktop/scripts/esrp-macos.mjs archive "$MAC_ESRP_ROOT"
        displayName: Prepare arm64 and x64 application ZIPs for ESRP
        env:
          MAC_ESRP_ROOT: $(MacEsrpRoot)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ''
          CSC_KEY_PASSWORD: ''
          APPLE_ID: ''
          APPLE_APP_SPECIFIC_PASSWORD: ''
          APPLE_TEAM_ID: ''

      - ${{ each arch in split('arm64,x64', ',') }}:
          - task: EsrpAppleCodeSigning@1
            displayName: ESRP Developer ID sign ${{ arch }} application
            timeoutInMinutes: 30
            inputs:
              ConnectedServiceName: $(CodeSignConnectedServiceName)
              AppRegistrationClientId: $(CodeSignAppRegistrationClientId)
              AppRegistrationTenantId: $(CodeSignAppRegistrationTenantId)
              AuthAKVName: $(CodeSignKeyVaultName)
              AuthSignCertName: $(CodeSignAuthSignCertificateName)
              FolderPath: '$(MacEsrpRoot)/sign-input/${{ arch }}'
              Pattern: Huabu.zip
              signConfigType: inlineSignParams
              inlineOperation: |
                [
                  {
                    "KeyCode": "CP-401337-Apple",
                    "OperationCode": "MacAppDeveloperSign",
                    "Parameters": { "Hardening": "Enable", "codesign-options": "enable" },
                    "ToolName": "sign",
                    "ToolVersion": "1.0"
                  }
                ]
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              ESRP_GATEWAY_API: https://api.esrp.microsoft.com/api/v2

      - bash: |
          set -euo pipefail
          node apps/desktop/scripts/esrp-macos.mjs verify-signed "$MAC_ESRP_ROOT"
        displayName: Verify Developer ID signatures and prepare notarization
        env:
          MAC_ESRP_ROOT: $(MacEsrpRoot)

      - ${{ each arch in split('arm64,x64', ',') }}:
          - task: EsrpAppleCodeSigning@1
            displayName: ESRP notarize ${{ arch }} signed application
            timeoutInMinutes: 55
            inputs:
              ConnectedServiceName: $(CodeSignConnectedServiceName)
              AppRegistrationClientId: $(CodeSignAppRegistrationClientId)
              AppRegistrationTenantId: $(CodeSignAppRegistrationTenantId)
              AuthAKVName: $(CodeSignKeyVaultName)
              AuthSignCertName: $(CodeSignAuthSignCertificateName)
              FolderPath: '$(MacEsrpRoot)/notarize-input/${{ arch }}'
              Pattern: Huabu.zip
              signConfigType: inlineSignParams
              inlineOperation: |
                [
                  {
                    "KeyCode": "CP-401337-Apple",
                    "OperationCode": "MacAppDeveloperNotarize",
                    "Parameters": {},
                    "ToolName": "sign",
                    "ToolVersion": "1.0"
                  }
                ]
              NotarizationTimeout: '45'
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              ESRP_GATEWAY_API: https://api.esrp.microsoft.com/api/v2

      - bash: |
          set -euo pipefail
          node apps/desktop/scripts/esrp-macos.mjs package "$MAC_ESRP_ROOT" "$BUILD_SOURCESDIRECTORY/../huabu-electron-out"
        displayName: Staple and verify applications, build and verify DMG and ZIP releases
        env:
          MAC_ESRP_ROOT: $(MacEsrpRoot)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ''
          CSC_KEY_PASSWORD: ''
          APPLE_ID: ''
          APPLE_APP_SPECIFIC_PASSWORD: ''
          APPLE_TEAM_ID: ''

      - pwsh: |
          $output = Join-Path $env:BUILD_SOURCESDIRECTORY '../huabu-electron-out'
          foreach ($pattern in @('*.dmg', '*.zip', '*.blockmap', 'latest-mac.yml')) {
            $files = @(Get-ChildItem -Path $output -Filter $pattern -File -ErrorAction Stop)
            if ($files.Count -eq 0) { throw "Missing required release asset: $pattern" }
            $files | Select-Object Name, Length
          }
        displayName: Validate macOS release assets

      - task: PublishPipelineArtifact@1
        displayName: Publish complete macOS release output
        inputs:
          targetPath: '$(Build.SourcesDirectory)/../huabu-electron-out'
          artifact: huabu-macos
          publishLocation: pipeline
