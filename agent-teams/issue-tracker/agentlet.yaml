schema: agentlet-agent-schema-v1
name: issue-tracker
description: Coordinates repository issues through isolated worktrees and dedicated Fixing Agent Threads

command:
  claude: claude-agent-acp
  copilot: copilot --acp --allow-all

require:
  prompts:
    - system_prompt.md
  copies:
    - from: assets/issue-tracker.html
      to: issue-tracker.html
    - from: references/fixing-agent-preamble.md
      to: fixing-agent-preamble.md
