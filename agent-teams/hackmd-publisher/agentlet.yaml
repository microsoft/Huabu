schema: agentlet-agent-schema-v1
name: hackmd-publisher
description: >
  Syncs selected canvas nodes to HackMD. Reads node content via Huabu Reachback,
  assembles a coherent markdown document respecting canvas topology (frame order,
  edges), and publishes to HackMD. Writes back a result node with the published URL.

command:
  claude: claude --acp --allow-all
  copilot: copilot --acp

require:
  cli-tools:
    - "@hackmd/hackmd-cli"
  skills:
    - https://github.com/hackmdio/hackmd-cli/tree/develop/hackmd-cli
  prompts:
    - system_prompt.md
