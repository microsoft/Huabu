schema: agentlet-agent-schema-v1
name: hackmd-publisher
description: >
  Syncs selected nodes to HackMD. Reads node content via Huabu Reachback,
  assembles a coherent markdown document respecting topology (frame order,
  edges), and publishes to HackMD. Writes back a result node with the published URL.

command:
  claude: claude-agent-acp
  copilot: copilot --acp --allow-all

require:
  env:
    - name: HMD_API_ACCESS_TOKEN
      description: HackMD API token used to publish documents
      required: true
      secret: true
  cli-tools:
    - package: '@hackmd/hackmd-cli'
      installer: npm
      scope: shared
      executables:
        - hackmd-cli
  skills:
    - https://github.com/hackmdio/hackmd-cli/tree/develop/hackmd-cli
  prompts:
    - system_prompt.md
